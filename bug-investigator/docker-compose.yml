services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bug_investigator
      MYSQL_USER: bugi
      MYSQL_PASSWORD: bugi
    ports:
      - "3309:3306"   # 3307 on the host: a locally installed MySQL usually owns 3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://bugi:bugi@mysql:3306/bug_investigator
      DATA_DIR: /data
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3309:3306"
    volumes:
      - app_data:/data

volumes:
  mysql_data:
  app_data:
